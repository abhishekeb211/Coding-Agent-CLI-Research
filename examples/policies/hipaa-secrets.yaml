policies:
  - id: hipaa-secrets
    name: "HIPAA: No Hardcoded Secrets"
    description: "Prevent hardcoded credentials in healthcare applications (HIPAA Security Rule 164.312)"
    cwe: ["798", "259", "321"]
    severity: critical
    action: deny
    enabled: true

  - id: hipaa-encryption
    name: "HIPAA: Weak Encryption"
    description: "Require strong encryption for PHI (HIPAA Security Rule 164.312(a)(2)(iv))"
    cwe: ["327", "326", "328"]
    severity: high
    action: deny
    enabled: true

  - id: hipaa-access-control
    name: "HIPAA: Access Control"
    description: "Enforce proper access controls (HIPAA Security Rule 164.312(a)(1))"
    cwe: ["284", "285", "862"]
    severity: high
    action: warn
    enabled: true
